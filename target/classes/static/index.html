<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Tracker</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Job Application Tracker</h1>
            <a href="add.html" class="btn">Add New Job</a>
        </header>

        <div class="stats-grid" id="statsGrid">
            <div class="stat-card"><h3>Total Applications</h3><div class="value" id="stat-total">0</div></div>
            <div class="stat-card"><h3>Applied</h3><div class="value" id="stat-applied">0</div></div>
            <div class="stat-card"><h3>Interview</h3><div class="value" id="stat-interview">0</div></div>
            <div class="stat-card"><h3>Assessment</h3><div class="value" id="stat-assessment">0</div></div>
            <div class="stat-card"><h3>Offered</h3><div class="value" id="stat-offered">0</div></div>
            <div class="stat-card"><h3>Rejected</h3><div class="value" id="stat-rejected">0</div></div>
            <div class="stat-card"><h3>Success Rate</h3><div class="value" id="stat-success">0%</div></div>
        </div>

        <div class="controls">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search company or title...">
            </div>
            
            <select id="statusFilter" class="filter-select">
                <option value="All">All Statuses</option>
                <option value="Applied">Applied</option>
                <option value="Interview">Interview</option>
                <option value="Assessment">Assessment</option>
                <option value="Offered">Offered</option>
                <option value="Rejected">Rejected</option>
            </select>

            <select id="platformFilter" class="filter-select">
                <option value="All">All Platforms</option>
                <option value="Upwork">Upwork</option>
                <option value="LinkedIn">LinkedIn</option>
                <option value="Campus">Campus</option>
                <option value="Direct">Direct</option>
            </select>
            
            <button id="sortToggle" class="btn btn-secondary">Sort: Newest First</button>
        </div>

        <div class="table-responsive">
            <table id="jobsTable">
                <thead>
                    <tr>
                        <th>Company</th>
                        <th>Title</th>
                        <th>Type</th>
                        <th>Platform</th>
                        <th>Date Applied</th>
                        <th>Follow Up</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="jobsTableBody">
                    <!-- Rows will be populated by JS -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="js/dashboard.js"></script>
</body>
</html>
